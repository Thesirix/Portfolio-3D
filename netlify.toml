[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fichiers dont le nom contient un hash (JS, CSS, vidéos) : ne changent jamais
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Police, modèle 3D et images du parallaxe : cache d'une semaine
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/parallax/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
